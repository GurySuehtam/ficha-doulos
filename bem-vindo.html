<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha - Família Doulos</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c79a15;--black:#0f0f0f;--bg:#fdf9ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#222}
header{background:var(--black);color:#fff;text-align:center;padding:14px;position:sticky;top:0;z-index:10}
header h1{font-family:'Montserrat';font-size:12px}
.container{max-width:560px;margin:0 auto;padding:18px}
.hello{font-family:'Montserrat';font-size:28px;line-height:1.2;margin-top:10px}
.hello span{color:var(--gold)}
.sub{color:#666;font-size:13px;margin:6px 0 14px}
.progress{height:6px;background:#efe7c3;border-radius:10px;overflow:hidden;margin-bottom:16px}
.progress div{height:100%;background:var(--gold);width:25%;transition:.4s}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.step{display:none}.step.active{display:block}
label{font-weight:600;font-size:11px;margin-top:12px;display:block;text-transform:uppercase;color:#555;letter-spacing:.3px}
input,select{width:100%;padding:12px;border:1.5px solid #e6dfbd;border-radius:10px;margin-top:6px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Montserrat';font-weight:800;cursor:pointer;margin-top:16px}
.btn-gold{background:var(--gold);color:#111}
.btn-outline{background:#fff;border:1.5px solid #ddd;color:#333}
</style>
</head>
<body>
<header><h1>IGREJA ASSEMBLÉIA DE DEUS MINISTÉRIO DOULOS</h1></header>

<div class="container">
  <h2 class="hello" id="hello">Olá! Preencha sua ficha</h2>
  <p class="sub">Você está a poucos passos de fazer parte oficialmente da Família Doulos.</p>
  <div class="progress"><div id="bar"></div></div>

  <div class="step active" id="s1">
    <div class="card">
      <h3 style="font-family:Montserrat">1/4 - Dados Pessoais</h3>
      <label>Nome Completo</label><input id="nome">
      <div class="row"><div><label>Data Nasc. (DIA/MÊS/ANO)</label><input id="nasc" type="text" placeholder="DD/MM/AAAA" maxlength="10" oninput="mascaraData(this)"></div><div><label>Sexo</label><select id="sexo"><option value="">Selecione</option><option>Masculino</option><option>Feminino</option></select></div></div>
      <div class="row"><div><label>RG</label><input id="rg"></div><div><label>CPF</label><input id="cpf" placeholder="000.000.000-00"></div></div>
      <label>WhatsApp</label><input id="tel" placeholder="(21) 9 0000-0000"><label>Estado Civil</label><input id="civil"><label>Profissão</label><input id="prof">
      <button class="btn btn-gold" onclick="next(1,2)">Continuar</button>
    </div>
  </div>

  <div class="step" id="s2">
    <div class="card">
      <h3 style="font-family:Montserrat">2/4 - Endereço e Família</h3>
      <label>Endereço</label><input id="end"><div class="row"><div><label>Bairro</label><input id="bairro"></div><div><label>CEP</label><input id="cep"></div></div>
      <label>Nome do Pai</label><input id="pai"><label>Nome da Mãe</label><input id="mae">
      <div class="row"><div><label>Cônjuge</label><input id="conjuge"></div><div><label>Possui Filhos? Quantos?</label><input id="filhos" type="text" placeholder="Ex: 2 - João e Maria"></div></div>
      <button class="btn btn-gold" onclick="next(2,3)">Continuar</button><button class="btn btn-outline" onclick="next(2,1)">Voltar</button>
    </div>
  </div>

  <div class="step" id="s3">
    <div class="card">
      <h3 style="font-family:Montserrat">3/4 - Vida Cristã</h3>
      <label>Data da Conversão (DIA/MÊS/ANO)</label><input id="conversao" type="text" placeholder="DD/MM/AAAA" maxlength="10" oninput="mascaraData(this)"><label>Batizado?</label><select id="batizado"><option>Sim</option><option>Não</option><option>Quero me batizar</option></select>
      <label>Igreja Anterior</label><input id="igant"><label>Carteirinha?</label><select id="carteirinha"><option>Não</option><option>Sim</option></select><label>Pastor que acompanhou</label><input id="pastor">
      <button class="btn btn-gold" onclick="next(3,4)">Continuar</button><button class="btn btn-outline" onclick="next(3,2)">Voltar</button>
    </div>
  </div>

  <div class="step" id="s4">
    <div class="card">
      <h3 style="font-family:Montserrat">4/4 - Finalizar</h3>
      <label>Ministério que deseja servir</label><input id="ministerio"><label>Testemunho / Obs</label><input id="obs" style="height:70px"><label>Assinatura (nome completo)</label><input id="assinatura">
      <button class="btn btn-gold" onclick="enviar()">Enviar para a Secretária 💬</button><button class="btn btn-outline" onclick="next(4,3)">Voltar</button>
    </div>
  </div>
</div>

<script>
function mascaraData(i){
  let v = i.value.replace(/\D/g,"").slice(0,8);
  if(v.length >= 5) v = v.replace(/(\d{2})(\d{2})(\d{1,4})/,"$1/$2/$3");
  else if(v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/,"$1/$2");
  i.value = v;
}
const nomeSalvo = localStorage.getItem('doulos_nome') || '';
if(nomeSalvo){
  document.getElementById('hello').innerHTML = `Olá, <span>${nomeSalvo}</span>! Preencha sua ficha`;
  document.getElementById('nome').value = nomeSalvo;
}
function next(c,n){document.getElementById('s'+c).classList.remove('active');document.getElementById('s'+n).classList.add('active');document.getElementById('bar').style.width=(n*25)+'%';window.scrollTo(0,0);}
function enviar(){
  const d={nome:document.getElementById('nome').value,tel:document.getElementById('tel').value,nasc:document.getElementById('nasc').value,sexo:document.getElementById('sexo').value,rg:document.getElementById('rg').value,cpf:document.getElementById('cpf').value,civil:document.getElementById('civil').value,prof:document.getElementById('prof').value,end:document.getElementById('end').value,bairro:document.getElementById('bairro').value,cep:document.getElementById('cep').value,pai:document.getElementById('pai').value,mae:document.getElementById('mae').value,conjuge:document.getElementById('conjuge').value,filhos:document.getElementById('filhos').value,conversao:document.getElementById('conversao').value,batizado:document.getElementById('batizado').value,igant:document.getElementById('igant').value,carteirinha:document.getElementById('carteirinha').value,pastor:document.getElementById('pastor').value,ministerio:document.getElementById('ministerio').value,obs:document.getElementById('obs').value,assinatura:document.getElementById('assinatura').value};
  if(!d.nome||!d.tel){alert('Preencha nome e WhatsApp');return;}
  let msg=`*NOVA FICHA - FAMÍLIA DOULOS*%0A%0A`;for(let k in d){msg+=`*${k.toUpperCase()}:* ${d[k]}%0A`;}
  window.open(`https://wa.me/5521983234385?text=${msg}`,'_blank');
}
</script>
</body>
</html>
